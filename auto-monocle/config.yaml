name: Auto-Monocle ARM64 Fix
description: Auto-discover HA cameras and expose them to Alexa via Monocle Gateway
version: "0.1.14"
slug: auto-monocle
url: https://github.com/markothanos-boop/ha-monocle-arm64-fix
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: false
panel_icon: mdi:camera-account
panel_title: Auto-Monocle ARM64 Fix
homeassistant_api: true
auth_api: true
hassio_api: true
map:
  - homeassistant_config:ro
  - ssl:ro
options:
  monocle_token: ""
  gateway_host: ""
  gateway_fqdn: ""
  cert_file: "monocle-fullchain.pem"
  key_file: "monocle-privkey.pem"
  auto_discover: false
  refresh_interval: 300
  stream_quality: "high"
  camera_filters: []
schema:
  monocle_token: str
  gateway_host: str
  gateway_fqdn: str
  cert_file: str
  key_file: str
  auto_discover: bool
  refresh_interval: int(60,3600)
  stream_quality: list(high|medium|low)
  camera_filters:
    - str?
ports:
  443/tcp: 443
  8443/tcp: 8443
ports_description:
  443/tcp: Monocle Gateway HTTPS
  8443/tcp: Monocle Gateway Secure WebSocket
